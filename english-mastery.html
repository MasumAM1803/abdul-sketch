/* Responsive layout refinements */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-width:320px;overflow-x:hidden}
button,select,input,textarea{max-width:100%;min-height:42px}
button{touch-action:manipulation}
.app,.main,.content{min-width:0;width:100%}
.content{overflow-wrap:anywhere}
.panel,.stat,.level-card,.word-card,.lesson-item{min-width:0}
img,svg,video,canvas{max-width:100%;height:auto}
.nav button{flex-shrink:0}
.toolbar select,.toolbar input,.toolbar textarea{min-width:0}
.word-card{align-items:start}
.word-actions{flex-wrap:wrap}
.lesson-item>div{min-width:0;overflow-wrap:anywhere}
table{min-width:520px}
@media(max-width:950px){
  .app{display:flex;flex-direction:column}
  .side{position:relative;padding:12px 14px;gap:12px}
  .brand{padding:0 2px}
  .nav{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 0 5px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .nav button{padding:10px 12px;border-radius:9px;flex:0 0 auto}
  .main{width:100%}
  .top{position:sticky;top:0;flex-wrap:wrap;align-items:center;padding:12px 16px}
  .top h1{font-size:clamp(18px,3vw,22px)}
  .actions{display:flex;flex-wrap:wrap;min-width:0}
  .actions select{max-width:100%;min-width:0}
  .content{padding:18px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){
  body{font-size:14px}
  .side{padding:10px;gap:10px}
  .brand{gap:9px}
  .logo{width:36px;height:36px;flex:0 0 36px}
  .nav button{font-size:13px;padding:9px 11px}
  .top{padding:11px 12px;gap:10px}
  .top h1{width:100%}
  .actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .actions select{width:100%;min-width:0}
  .actions button{white-space:nowrap;padding:9px 11px}
  .content{padding:12px}
  .hero{padding:20px 16px;border-radius:14px}
  .hero h2{font-size:clamp(23px,7vw,30px)}
  .grid,.level-grid,.two-col{grid-template-columns:minmax(0,1fr);gap:10px}
  .stat,.panel,.level-card,.word-card{padding:14px;border-radius:12px}
  .stat strong{font-size:23px}
  .section{align-items:flex-start;flex-direction:column;margin:20px 0 10px}
  .section h2{font-size:19px}
  .toolbar{gap:8px}
  .toolbar>*{flex:1 1 100%;min-width:0}
  .toolbar button{flex:1 1 auto}
  .word-card{grid-template-columns:minmax(0,1fr);gap:10px}
  .word-card h3{font-size:20px;overflow-wrap:anywhere}
  .phonetic{display:inline-block;margin-left:4px}
  .word-actions{flex-direction:row;gap:7px}
  .word-actions button{flex:1 1 auto;min-width:0}
  .lesson-item{align-items:stretch;flex-direction:column;gap:10px}
  .lesson-item button{width:100%}
  .flashcard{min-height:200px;padding:18px 12px}
  .bigword{font-size:clamp(28px,9vw,38px);overflow-wrap:anywhere}
  .bigtranslation{font-size:20px;overflow-wrap:anywhere}
  .option{padding:10px;gap:8px}
  .option span{min-width:0;overflow-wrap:anywhere}
  .notice{overflow-wrap:anywhere}
  .footer{padding:18px 8px}
  table{font-size:12px}
}
@media(max-width:380px){
  .actions{grid-template-columns:minmax(0,1fr)}
  .actions button{width:100%}
  .nav button{padding:8px 9px;font-size:12px}
  .hero{padding:17px 13px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* Responsive sidebar navigation */
.menu-toggle{display:none;align-items:center;gap:8px;white-space:nowrap}
.sidebar-overlay{display:none}
@media(max-width:950px){
  .app{display:flex;flex-direction:row;min-height:100vh}
  .side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(290px,85vw);height:100dvh;overflow-y:auto;padding:20px 14px;gap:18px;transform:translateX(-105%);transition:transform .25s ease;box-shadow:12px 0 36px #0b173044}
  .brand{padding:0 7px}
  .nav{display:grid;gap:5px;overflow:visible;padding:0}
  .nav button{width:100%;text-align:left;white-space:normal;flex-shrink:1;padding:12px;border-radius:9px}
  .side-note{display:block;margin-top:auto}
  .sidebar-overlay{position:fixed;z-index:29;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:#07122680;opacity:0;pointer-events:none;display:block;transition:opacity .25s ease}
  body.sidebar-open{overflow:hidden}
  body.sidebar-open .side{transform:translateX(0)}
  body.sidebar-open .sidebar-overlay{opacity:1;pointer-events:auto}
  .menu-toggle{display:inline-flex;min-height:42px;flex:0 0 auto}
  .top{display:flex;flex-wrap:wrap;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}
  .top h1{width:auto;flex:1;min-width:0}
  .actions{margin-left:auto}
}
@media(max-width:600px){
  .side{width:min(280px,88vw);padding:16px 12px}
  .top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}
  .menu-toggle{grid-column:1;grid-row:1;padding:9px 11px}
  .top h1{grid-column:2;grid-row:1;width:auto;font-size:18px;overflow-wrap:anywhere}
  .actions{grid-column:1 / -1;grid-row:2;width:100%;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
  .actions select{width:100%;min-width:0}
}
@media(prefers-reduced-motion:reduce){.side,.sidebar-overlay{transition:none}}

$('#loadBtn').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()))}catch(x){alert(t('loadError'))}e.target.value=''};$('#language').onchange=e=>{lang=e.target.value;render()};$('#nav').onclick=e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;activeLesson=null;quiz=null;render()}};
const menuToggle=$('#menuToggle'),sidebarOverlay=$('#sidebarOverlay');function closeSidebar(){document.body.classList.remove('sidebar-open');menuToggle.setAttribute('aria-expanded','false')}menuToggle.onclick=()=>{let open=!document.body.classList.contains('sidebar-open');document.body.classList.toggle('sidebar-open',open);menuToggle.setAttribute('aria-expanded',String(open))};sidebarOverlay.onclick=closeSidebar;$('#nav').addEventListener('click',e=>{if(e.target.closest('[data-view]'))closeSidebar()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSidebar()});
function render(){let titles={dashboard:t('dashboard'),lessons:t('lessons'),dictionary:t('dictionary'),flashcards:t('flashcards'),exams:t('exams'),speaking:t('speaking'),progress:t('progress')};$('#pageTitle').textContent=titles[view];$('#language').value=lang;$('#loadBtn').classList.toggle('hidden',Boolean(D));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(!D){$('#content').innerHTML=`<div class="panel"><h2>${esc(t('missing'))}</h2><p class="muted">${esc(t('dataHint'))}</p><button id="loadEmpty">${esc(t('loadJson'))}</button></div>`;$('#loadEmpty').onclick=()=>$('#jsonFile').click();return}let html={dashboard:dash,lessons:lessonView,dictionary:dict,flashcards:flashcards,exams:exams,speaking:speaking,progress:progressView}[view]();$('#content').innerHTML=html;wire()}
function dash(){let done=P.done.length,master=P.mastered.length;return `<div class="hero"><span class="pill">CEFR A1–C2</span><h2>${esc(t('heroTitle'))}</h2><p>${esc(t('heroText'))}</p><div class="toolbar"><button data-act="go-lessons">${esc(t('start'))}</button><button class="secondary" data-act="go-dict">${esc(t('openDict'))}</button></div></div><div class="grid"><div class="stat"><small>${esc(t('lessonsCount'))}</small><strong>${lessons().length}</strong><span class="muted small">${done} ${esc(t('completed'))}</span></div><div class="stat"><small>${esc(t('wordsCount'))}</small><strong>${words().length}</strong><span class="muted small">English → Indonesia</span></div><div class="stat"><small>${esc(t('questionsCount'))}</small><strong>${quizzes().length}</strong><span class="muted small">Auto-graded</span></div><div class="stat"><small>${esc(t('mastered'))}</small><strong>${master}</strong><span class="muted small">${words().length?Math.round(master/words().length*100):0}%</span></div></div><div class="section"><div><h2>${esc(t('roadmap'))}</h2><span class="muted">${esc(t('roadmapText'))}</span></div></div><div class="level-grid">${levels().map(l=>{let n=lessons().filter(x=>x.level===l.code).length,d=lessons().filter(x=>x.level===l.code&&P.done.includes(x.id)).length;return `<article class="level-card" style="--c:${colors[l.code]}"><span class="pill">${l.code}</span><h3>${esc(l.name)}</h3><p>${esc(bi(l.goalId,l.goalEn))}</p><div class="bar"><span style="width:${n?d/n*100:0}%"></span></div><p>${d}/${n} ${esc(t('completed').toLowerCase())}</p><button class="secondary" data-act="level-lessons" data-level="${l.code}">${esc(t('continue'))}</button></article>`}).join('')}</div><div class="two-col"><div><div class="section"><h2>${esc(t('recent'))}</h2><button class="ghost" data-act="go-dict">${esc(t('viewAll'))}</button></div><div class="word-list">${words().filter(w=>!P.mastered.includes(w.id)).slice(0,4).map(wordCard).join('')}</div></div><div><div class="section"><h2>${esc(t('tip'))}</h2></div><div class="panel"><div style="font-size:28px">💡</div><p>${esc(t('tipText'))}</p><div class="notice">${esc(t('saveNote'))}</div></div></div></div><div class="footer">${esc(D.meta?.title||'English Mastery')} · ${esc(D.meta?.version||'')}<br>${esc(bi(D.meta?.noteId,D.meta?.noteEn))}</div>`}
function wordCard(w){return `<article class="word-card"><div><div><h3>${esc(w.word)}</h3><span class="phonetic">${esc(w.phonetic||'')}</span> <span class="pill">${esc(w.level)}</span></div><div class="translation">${esc(w.translationId)}</div><div class="def">${esc(w.partOfSpeech||'')} · ${esc(w.topic||'')}</div>${w.definitionEn?`<div class="def"><b>${esc(t('definition'))}:</b> ${esc(w.definitionEn)}</div>`:''}<div class="example"><b>${esc(t('example'))}</b><div>${esc(w.exampleEn||'')}</div><em>${esc(w.exampleId||'')}</em></div>${w.synonyms?.length?`<div class="def"><b>${esc(t('synonyms'))}:</b> ${esc(w.synonyms.join(', '))}</div>`:''}</div><div class="word-actions"><button class="secondary" data-act="speak" data-word="${esc(w.word)}">🔊</button><button class="${P.mastered.includes(w.id)?'ghost':'secondary'}" data-act="toggle-word" data-id="${w.id}">${P.mastered.includes(w.id)?'✓ '+esc(t('markLearning')):'＋ '+esc(t('markMastered'))}</button></div></article>`}
function dict(){let q=$('#searchWord')?.value||'',arr=filterWords(q),topics=[...new Set(words().map(w=>w.topic).filter(Boolean))].sort();return `<div class="panel"><div class="section"><div><h2>${esc(t('dictionary'))}</h2><p class="muted">Cari kata Inggris untuk melihat terjemahan Indonesia, fonetik, kelas kata, level, contoh, dan sinonim.</p></div><span class="pill">EN → ID</span></div><div class="toolbar"><input id="searchWord" placeholder="${esc(t('search'))}" value="${esc(q)}"><select id="filterLevel"><option value="all">${esc(t('allLevels'))}</option>${levels().map(l=>`<option value="${l.code}" ${level===l.code?'selected':''}>${l.code} — ${esc(l.name)}</option>`).join('')}</select><select id="filterTopic"><option value="all">${esc(t('allTopics'))}</option>${topics.map(x=>`<option value="${esc(x)}" ${topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="filterStatus"><option value="all">${esc(t('allWords'))}</option><option value="learning" ${wordStatus==='learning'?'selected':''}>${esc(t('notMastered'))}</option><option value="mastered" ${wordStatus==='mastered'?'selected':''}>${esc(t('masteredOnly'))}</option></select></div><div class="muted small" id="wordCount">${t('showing')} ${arr.length} ${t('of')} ${words().length} ${t('words')}</div></div><div class="word-list" id="wordResults">${arr.length?arr.slice(0,100).map(wordCard).join(''):`<div class="empty">${esc(t('noResults'))}</div>`}</div>`}
function filterWords(q=''){q=q.trim().toLowerCase();return words().filter(w=>(!q||[w.word,w.translationId,w.exampleEn,w.exampleId,w.definitionEn,(w.synonyms||[]).join(' ')].some(s=>String(s||'').toLowerCase().includes(q)))&&(level==='all'||w.level===level)&&(topic==='all'||w.topic===topic)&&(wordStatus==='all'||(wordStatus==='mastered'?P.mastered.includes(w.id):!P.mastered.includes(w.id))))}
function lessonView(){let arr=lessons().filter(l=>level==='all'||l.level===level);if(activeLesson){let l=lessons().find(x=>x.id===activeLesson);if(!l)return '';return `<div class="panel"><button class="ghost" data-act="back">← ${esc(t('back'))}</button><p><span class="pill">${l.level}</span> ${esc(l.module)}</p><h2>${esc(l.title)}</h2><p>${esc(bi(l.explanationId,l.explanationEn))}</p><h3>${esc(t('example'))}</h3>${(l.examples||[]).map(e=>`<div class="example"><b>${esc(e.en)}</b><em>${esc(e.id)}</em></div>`).join('')}<h3>${esc(t('objectives'))}</h3><ul>${(lang==='en'?l.learningObjectivesEn:l.learningObjectivesId||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>${esc(t('practice'))}</h3><p>${esc(bi(l.practicePromptId,l.practicePromptEn))}</p><textarea rows="4" placeholder="${esc(t('practicePlaceholder'))}"></textarea><p class="muted small">${esc(t('practiceNote'))}</p><button data-act="complete-lesson" data-id="${l.id}">${P.done.includes(l.id)?'✓ '+esc(t('completed')):esc(t('markComplete'))}</button></div>`}return `<div class="panel"><div class="section"><div><h2>${esc(t('lessons'))}</h2><p class="muted">${esc(t('lessonsIntro'))}</p></div></div><div class="toolbar"><select id="lessonLevel"><option value="all">${esc(t('allLevels'))}</option>${levels().map(l=>`<option value="${l.code}" ${level===l.code?'selected':''}>${l.code} — ${esc(l.name)}</option>`).join('')}</select></div></div><div class="lesson-list">${arr.map(l=>`<div class="lesson-item"><div><span class="pill">${l.level}</span> ${P.done.includes(l.id)?'<span class="pill">✓ '+esc(t('completed'))+'</span>':''}<h3>${esc(l.title)}</h3><p>${esc(l.module)}</p></div><button data-act="open-lesson" data-id="${l.id}">${esc(t('openLesson'))} →</button></div>`).join('')}</div>`}
function flashcards(){let arr=words().filter(w=>(level==='all'||w.level===level)&&(wordStatus==='all'||(wordStatus==='mastered'?P.mastered.includes(w.id):!P.mastered.includes(w.id))));let w=arr.length?arr[flashIndex%arr.length]:null;return `<div class="panel"><div class="section"><div><h2>${esc(t('flashcards'))}</h2><p class="muted">${esc(t('flashHint'))}</p></div></div><div class="toolbar"><select id="flashLevel"><option value="all">${esc(t('allLevels'))}</option>${levels().map(l=>`<option value="${l.code}" ${level===l.code?'selected':''}>${l.code}</option>`).join('')}</select><select id="flashStatus"><option value="all">${esc(t('allWords'))}</option><option value="learning" ${wordStatus==='learning'?'selected':''}>${esc(t('notMastered'))}</option><option value="mastered" ${wordStatus==='mastered'?'selected':''}>${esc(t('masteredOnly'))}</option></select></div>${w?`<div class="flashcard"><span class="pill">${w.level} · ${esc(w.partOfSpeech)}</span><div class="bigword">${esc(w.word)}</div><div class="muted">${esc(w.phonetic||'')}</div>${flipped?`<div class="bigtranslation">${esc(w.translationId)}</div><div>${esc(w.exampleEn)}</div><div class="muted">${esc(w.exampleId)}</div>`:`<button data-act="flip">${esc(t('flip'))}</button>`}</div><div class="toolbar"><button class="secondary" data-act="flash-learning" data-id="${w.id}">${esc(t('learning'))}</button><button data-act="flash-known" data-id="${w.id}">${esc(t('known'))}</button><button class="secondary" data-act="next-card">${esc(t('nextCard'))} →</button></div><p class="muted small" style="text-align:center">${flashIndex+1} / ${arr.length}</p>`:'<div class="empty">No cards.</div>'}</div>`}
function exams(){if(quiz)return quizView();return `<div class="panel"><div class="section"><div><h2>${esc(t('exams'))}</h2><p class="muted">${esc(t('chooseExam'))}</p></div></div><div class="level-grid">${levels().map(l=>{let n=quizzes().filter(q=>q.level===l.code).length;return `<div class="stat"><span class="pill">${l.code}</span><strong>${n}</strong><small>${esc(t('questionsCount'))}</small><div class="toolbar"><button data-act="start-exam" data-level="${l.code}">${esc(t('startExam'))}</button></div></div>`}).join('')}</div><div class="notice">${esc(t('examNote'))}</div></div>`}
function quizView(){let qs=quiz.questions;if(quiz.finished){let pct=Math.round(quiz.score/qs.length*100),pass=pct>=(D.examSettings?.passMark||80);return `<div class="panel"><div style="font-size:44px">${pass?'🎉':'📘'}</div><h2>${esc(t('score'))}: ${pct}%</h2><p>${quiz.score}/${qs.length} ${esc(t('correct'))}</p><div class="bar"><span style="width:${pct}%"></span></div><div class="feedback ${pass?'good':'bad'}">${esc(pass?t('passed'):t('notPassed'))}</div><h3>Review</h3>${qs.map((q,i)=>`<div class="lesson-item" style="display:block;margin:8px 0"><b>${i+1}. ${esc(bi(q.questionId,q.questionEn))}</b><p>${esc(t('correct'))}: ${esc(q.options[q.answer])}</p><p class="muted">${esc(bi(q.explanationId,q.explanationEn))}</p></div>`).join('')}<div class="toolbar"><button data-act="restart">${esc(t('restart'))}</button><button class="secondary" data-act="exit">${esc(t('back'))}</button></div></div>`}let q=qs[quiz.i];return `<div class="panel"><span class="pill">${quiz.level}</span> <span class="muted small">${t('question')} ${quiz.i+1}/${qs.length}</span><div class="bar" style="margin:14px 0"><span style="width:${(quiz.i+1)/qs.length*100}%"></span></div><h2>${esc(bi(q.questionId,q.questionEn))}</h2><form id="quizForm">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" required><span>${esc(o)}</span></label>`).join('')}<div id="feedback"></div><div class="toolbar"><button type="submit">${quiz.i===qs.length-1?esc(t('finish')):esc(t('next'))}</button><button type="button" class="secondary" data-act="exit">${esc(t('back'))}</button></div></form></div>`}
function speaking(){return `<div class="section"><div><h2>${esc(t('speaking'))}</h2><p class="muted">${esc(t('speakingHint'))}</p></div></div><div class="level-grid">${(D.speakingPractice||[]).map(s=>`<article class="level-card" style="--c:${colors[s.level]}"><span class="pill">${s.level}</span><h3>${esc(s.title)}</h3><p>${esc(bi(s.promptId,s.promptEn))}</p><details><summary>${esc(t('sample'))}</summary><p><b>${esc(s.sampleEn)}</b></p><p>${esc(s.sampleId)}</p></details><h4>${esc(t('rubric'))}</h4><ul>${s.rubric.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="secondary" data-act="speak-prompt" data-id="${s.id}">🔊 ${esc(t('prompt'))}</button></article>`).join('')}</div><div class="notice" style="margin-top:14px">${esc(t('recordingNote'))}</div>`}
function progressView(){let avg=P.history.length?Math.round(P.history.reduce((a,x)=>a+x.score,0)/P.history.length):null;return `<div class="grid"><div class="stat"><small>${esc(t('wordsMastered'))}</small><strong>${P.mastered.length}/${words().length}</strong><div class="bar"><span style="width:${words().length?P.mastered.length/words().length*100:0}%"></span></div></div><div class="stat"><small>${esc(t('lessonsDone'))}</small><strong>${P.done.length}/${lessons().length}</strong><div class="bar"><span style="width:${lessons().length?P.done.length/lessons().length*100:0}%"></span></div></div><div class="stat"><small>Exams taken</small><strong>${P.history.length}</strong></div><div class="stat"><small>Average score</small><strong>${avg===null?'—':avg+'%'}</strong></div></div><div class="panel"><div class="section"><h2>${esc(t('history'))}</h2><button class="ghost" data-act="reset">${esc(t('reset'))}</button></div>${P.history.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th align="left">${t('date')}</th><th align="left">Level</th><th align="left">${t('result')}</th><th align="left">${t('status')}</th></tr>${[...P.history].reverse().map(h=>`<tr style="border-top:1px solid var(--line)"><td>${new Date(h.date).toLocaleString()}</td><td>${h.level}</td><td>${h.score}%</td><td>${h.passed?'✓ '+t('passed'):t('notPassed')}</td></tr>`).join('')}</table></div>`:`<div class="empty">${esc(t('noHistory'))}</div>`}<p class="muted small">${esc(t('saveNote'))}</p></div>`}
function wire(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset));$('#searchWord')?.addEventListener('input',()=>{let q=$('#searchWord').value,arr=filterWords(q);$('#wordResults').innerHTML=arr.length?arr.slice(0,100).map(wordCard).join(''):`<div class="empty">${esc(t('noResults'))}</div>`;$('#wordCount').textContent=`${t('showing')} ${arr.length} ${t('of')} ${words().length} ${t('words')}`;wireActionsOnly()});$('#filterLevel')?.addEventListener('change',e=>{level=e.target.value;render()});$('#filterTopic')?.addEventListener('change',e=>{topic=e.target.value;render()});$('#filterStatus')?.addEventListener('change',e=>{wordStatus=e.target.value;render()});$('#lessonLevel')?.addEventListener('change',e=>{level=e.target.value;render()});$('#flashLevel')?.addEventListener('change',e=>{level=e.target.value;flashIndex=0;flipped=false;render()});$('#flashStatus')?.addEventListener('change',e=>{wordStatus=e.target.value;flashIndex=0;flipped=false;render()});$('#quizForm')?.addEventListener('submit',e=>{e.preventDefault();let val=new FormData(e.target).get('answer');if(val===null)return;let q=quiz.questions[quiz.i],ok=+val===q.answer;if(ok)quiz.score++;$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=(ok?t('correct'):t('incorrect'))+'. '+bi(q.explanationId,q.explanationEn);let btn=e.target.querySelector('[type=submit]');btn.onclick=ev=>{ev.preventDefault();quiz.i++;if(quiz.i>=quiz.questions.length){quiz.finished=true;let score=Math.round(quiz.score/quiz.questions.length*100);P.history.push({date:new Date().toISOString(),level:quiz.level,score,passed:score>=(D.examSettings?.passMark||80)});save()}render()}})}function wireActionsOnly(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset))}
function act(a,d){if(a==='go-lessons'){view='lessons';render();return}if(a==='go-dict'){view='dictionary';render();return}if(a==='level-lessons'){level=d.level;view='lessons';render();return}if(a==='open-lesson'){activeLesson=d.id;render();return}if(a==='back'){activeLesson=null;render();return}if(a==='complete-lesson'){if(!P.done.includes(d.id))P.done.push(d.id);save();render();return}if(a==='toggle-word'||a==='flash-known'||a==='flash-learning'){if(a==='flash-learning'||P.mastered.includes(d.id))P.mastered=P.mastered.filter(x=>x!==d.id);else P.mastered.push(d.id);save();if(view==='flashcards'){flashIndex++;flipped=false}render();return}if(a==='speak'){say(d.word);return}if(a==='speak-prompt'){let s=D.speakingPractice.find(x=>x.id===d.id);if(s)say(bi(s.promptId,s.promptEn));return}if(a==='flip'){flipped=true;render();return}if(a==='next-card'){flashIndex++;flipped=false;render();return}if(a==='start-exam'){let arr=quizzes().filter(q=>q.level===d.level);if(!arr.length){alert(t('noQuestions'));return}arr.sort(()=>Math.random()-.5);quiz={level:d.level,questions:arr.slice(0,Math.min(D.examSettings?.questionCountByLevel||10,arr.length)),i:0,score:0,finished:false};render();return}if(a==='restart'){let l=quiz.level;quiz=null;act('start-exam',{level:l});return}if(a==='exit'){quiz=null;render();return}if(a==='reset'&&confirm(t('clearConfirm'))){P={mastered:[],done:[],history:[]};save();render();alert(t('resetDone'))}}
function say(s){if(!('speechSynthesis'in window)){alert('Text-to-speech is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
auto();
</script></body></html>
