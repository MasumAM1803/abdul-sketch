<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Platform Adventure - 4 Levels</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
    user-select: none;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#gameWrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #5c94fc;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
}

/* HUD */
#hud {
    position: absolute;
    top: 15px;
    left: 20px;
    right: 20px;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: white;
    font-weight: bold;
    font-size: 18px;

    text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000;
}

.hudGroup {
    display: flex;
    gap: 22px;
}

#levelDisplay {
    color: #ffe600;
}

/* Start / Game Over screens */
.screen {
    position: absolute;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.72);
    color: white;
    text-align: center;
}

.screen.hidden {
    display: none;
}

.screen h1 {
    font-size: clamp(38px, 7vw, 80px);
    margin-bottom: 15px;
    color: #ffdf00;

    text-shadow:
        5px 5px 0 #9b1b1b,
        -2px -2px 0 #000;
}

.screen h2 {
    font-size: clamp(28px, 5vw, 55px);
    color: #fff;
    margin-bottom: 15px;
}

.screen p {
    max-width: 650px;
    line-height: 1.6;
    font-size: 18px;
    margin-bottom: 25px;
}

button {
    border: none;
    background: #e52521;
    color: white;
    font-weight: bold;
    font-size: 20px;
    padding: 14px 30px;
    border-radius: 8px;
    cursor: pointer;

    box-shadow:
        0 5px 0 #8c1513;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #8c1513;
}

#instructions {
    margin-top: 20px;
    font-size: 14px;
    opacity: 0.9;
}

/* Mobile controls */
#mobileControls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 15;

    display: none;
    justify-content: space-between;
    padding: 0 25px;

    pointer-events: none;
}

.mobileLeft,
.mobileRight {
    display: flex;
    gap: 15px;
}

.controlBtn {
    width: 68px;
    height: 68px;

    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.5);

    background: rgba(0,0,0,.35);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: bold;

    pointer-events: auto;

    touch-action: none;
}

.controlBtn:active {
    background: rgba(255,255,255,.3);
}

@media (max-width: 800px) {
    #mobileControls {
        display: flex;
    }

    #hud {
        font-size: 13px;
        top: 10px;
        left: 10px;
        right: 10px;
    }

    .hudGroup {
        gap: 10px;
    }

    #instructions {
        display: none;
    }
}
</style>
</head>

<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="hudGroup">
            <span>⭐ <span id="score">000000</span></span>
            <span>🪙 <span id="coins">00</span></span>
        </div>

        </p>

    </div>

    <!-- Level Complete -->

</div>

/* =========================================================
   OBJECT HELPERS
========================================================= */

function coin(x, y) {

    return {
        x,
        y,
        radius: 10,
        collected: false,
        animation: Math.random() * Math.PI * 2
    };
}


function enemy(x, y) {

    return {
        x,
        y,
        width: 38,
        height: 35,

        vx: -1.2 - currentLevel * 0.15,

        alive: true
    };
}


function addClouds(count) {

    for (let i = 0; i < count; i++) {

        clouds.push({
            x: Math.random() * 4500,
            y: 40 + Math.random() * 180,
            size: 0.7 + Math.random() * 1.3
        });
    }
}


/* =========================================================
   COLLISION
========================================================= */

function rectangleCollision(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.width > b.x &&
        a.y < b.y + b.h &&
        a.y + a.height > b.y
    );
}


function playerPlatformCollision(previousY) {

    player.grounded = false;

    for (const p of platforms) {

        if (
            player.x + player.width > p.x &&
            player.x < p.x + p.w &&
            player.y + player.height >= p.y &&
            previousY + player.height <= p.y + 8 &&
            player.vy >= 0
        ) {

            player.y = p.y - player.height;

            player.vy = 0;
            player.grounded = true;
        }
    }
}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    const previousY = player.y;

    if (keys.left) {
        player.vx = -MOVE_SPEED;
    }
    else if (keys.right) {
        player.vx = MOVE_SPEED;
    }
    else {
        player.vx *= 0.78;
    }

    if (Math.abs(player.vx) < 0.1) {
        player.vx = 0;
    }

    if (
        keys.jump &&
        !jumpPressed &&
        player.grounded
    ) {

        player.vy = -JUMP_POWER;
        player.grounded = false;

        jumpPressed = true;
    }

    if (!keys.jump) {
        jumpPressed = false;
    }

    player.vy += GRAVITY;

    if (player.vy > 16) {
        player.vy = 16;
    }

    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) {
        player.x = 0;
    }

    playerPlatformCollision(previousY);

    if (player.y > HEIGHT + 150) {
        loseLife();
    }

    if (player.invincible > 0) {
        player.invincible--;
    }
}


/* =========================================================
   UPDATE ENEMIES
========================================================= */

function updateEnemies() {

    for (const e of enemies) {

        if (!e.alive) {
            continue;
        }

        e.x += e.vx;

        /*
           Reverse when reaching a platform edge.
        */

        let standingPlatform = null;

        for (const p of platforms) {

            if (
                e.x + e.width > p.x &&
                e.x < p.x + p.w &&
                Math.abs((e.y + e.height) - p.y) < 10
            ) {
                standingPlatform = p;
                break;
            }
        }

        if (standingPlatform) {

            if (
                e.x <= standingPlatform.x ||
                e.x + e.width >= standingPlatform.x + standingPlatform.w
            ) {
                e.vx *= -1;
            }
        }

        /*
           Enemy / player collision.
        */

        if (
            player.invincible <= 0 &&
            player.x < e.x + e.width &&
            player.x + player.width > e.x &&
            player.y < e.y + e.height &&
            player.y + player.height > e.y
        ) {

            /*
               Jump on enemy
            */

            if (
                player.vy > 0 &&
                player.y + player.height - e.y < 20
            ) {

                e.alive = false;

                player.vy = -8;

                score += 200;
            }

            else {

                loseLife();
            }
        }
    }
}


/* =========================================================
   UPDATE COINS
========================================================= */

function updateCoins() {

    for (const c of coins) {

        if (c.collected) {
            continue;
        }

        c.animation += 0.08;

        const dx =
            player.x + player.width / 2 - c.x;

        const dy =
            player.y + player.height / 2 - c.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < 28) {

            c.collected = true;

            coinsCollected++;
            score += 100;
        }
    }
}


/* =========================================================
   POWER UPS
========================================================= */

function updatePowerUps() {

    for (const p of powerUps) {

        if (p.collected) {
            continue;
        }

        if (
            player.x < p.x + p.w &&
            player.x + player.width > p.x &&
            player.y < p.y + p.h &&
            player.y + player.height > p.y
        ) {

            p.collected = true;

            player.invincible = 60 * 8;

            score += 500;
        }
    }
}


/* =========================================================
   FLAG
========================================================= */

function checkFlag() {

    if (!flag) {
        return;
    }

    if (
        player.x + player.width > flag.x &&
        player.x < flag.x + 50 &&
        player.y + player.height > flag.y
    ) {

        completeLevel();
    }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const target =
        player.x - WIDTH * 0.35;

    cameraX +=
        (target - cameraX) * 0.1;

    if (cameraX < 0) {
        cameraX = 0;
    }

    const maxCamera = 4300 - WIDTH;

    if (cameraX > maxCamera) {
        cameraX = maxCamera;
    }
}


/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife() {

    if (player.invincible > 0) {
        return;
    }

    lives--;

    updateHUD();

    if (lives <= 0) {

        gameRunning = false;

        document.getElementById("gameOverMessage").textContent =
            "Your final score was " + score + ".";

        document
            .getElementById("gameOverScreen")
            .classList.remove("hidden");

        return;
    }

    player.x = player.spawnX;
    player.y = player.spawnY;

    player.vx = 0;
    player.vy = 0;

    player.invincible = 120;

    cameraX = 0;
}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function completeLevel() {

    if (levelComplete) {
        return;
    }

    levelComplete = true;
    gameRunning = false;

    score += 1000;

    updateHUD();

    if (currentLevel >= TOTAL_LEVELS) {

        document.getElementById("finalScore").textContent = score;

        document
            .getElementById("winScreen")
            .classList.remove("hidden");

    }
    else {

        document.getElementById("levelTitle").textContent =
            "LEVEL " + currentLevel + " COMPLETE!";

        document.getElementById("levelMessage").textContent =
            "Great job! Score: " + score +
            " | Coins: " + coinsCollected;

        document
            .getElementById("levelScreen")
            .classList.remove("hidden");
    }
}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel() {

    levelComplete = false;

    createLevel(currentLevel);

    updateHUD();

    gameRunning = true;
}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel() {

    currentLevel++;

    document
        .getElementById("levelScreen")
        .classList.add("hidden");

    startLevel();
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    score = 0;
    coinsCollected = 0;
    lives = 3;
    currentLevel = 1;

    document
        .querySelectorAll(".screen")
        .forEach(screen => screen.classList.add("hidden"));

    startLevel();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document.getElementById("score").textContent =
        String(score).padStart(6, "0");

    document.getElementById("coins").textContent =
        String(coinsCollected).padStart(2, "0");

    document.getElementById("lives").textContent =
        lives;

    document.getElementById("levelDisplay").textContent =
        "LEVEL " + currentLevel;
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    /*
       Sky
    */

    ctx.fillStyle = "#5c94fc";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    /*
       Clouds
    */

    for (const cloud of clouds) {

        const x = cloud.x - cameraX * 0.25;
        const y = cloud.y;
        const s = cloud.size;

        if (x < -200 || x > WIDTH + 200) {
            continue;
        }

        ctx.fillStyle = "rgba(255,255,255,.9)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25 * s,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 30 * s,
            y - 12 * s,
            32 * s,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 65 * s,
            y,
            25 * s,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    /*
       Hills
    */

    drawHills();

    /*
       Ground underneath the world
    */

    ctx.fillStyle = "#79b82a";

    ctx.fillRect(
        0,
        HEIGHT - 40,
        WIDTH,
        40
    );
}


function drawHills() {

    const offset = -(cameraX * 0.15);

    ctx.fillStyle = "#75bf35";

    for (let i = -1; i < 10; i++) {

        const x = i * 420 + offset;

        ctx.beginPath();

        ctx.moveTo(x, HEIGHT - 40);

        ctx.quadraticCurveTo(
            x + 210,
            HEIGHT - 300,
            x + 420,
            HEIGHT - 40
        );

        ctx.fill();
    }
}


/* =========================================================
   DRAW PLATFORMS
========================================================= */

function drawPlatforms() {

    for (const p of platforms) {

        const x = p.x - cameraX;

        if (
            x + p.w < 0 ||
            x > WIDTH
        ) {
            continue;
        }

        /*
           Grass
        */

        ctx.fillStyle = "#43a047";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            12
        );

        /*
           Dirt
        */

        ctx.fillStyle = "#9b552d";

        ctx.fillRect(
            x,
            p.y + 12,
            p.w,
            p.h - 12
        );

        /*
           Dirt pattern
        */

        ctx.fillStyle = "#75401f";

        for (
            let xx = x + 10;
            xx < x + p.w;
            xx += 35
        ) {

            ctx.fillRect(
                xx,
                p.y + 30,
                8,
                8
            );

            ctx.fillRect(
                xx + 15,
                p.y + 55,
                8,
                8
            );
        }
    }
}


/* =========================================================
   DRAW COINS
========================================================= */

function drawCoins() {

    for (const c of coins) {

        if (c.collected) {
            continue;
        }

        const x = c.x - cameraX;

        if (
            x < -30 ||
            x > WIDTH + 30
        ) {
            continue;
        }

        const scale =
            0.7 + Math.abs(Math.sin(c.animation)) * 0.3;

        ctx.save();

        ctx.translate(x, c.y);

        ctx.scale(scale, 1);

        ctx.fillStyle = "#ffd600";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            c.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#b88600";
        ctx.lineWidth = 2;

        ctx.stroke();

        ctx.restore();
    }
}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies() {

    for (const e of enemies) {

        if (!e.alive) {
            continue;
        }

        const x = e.x - cameraX;

        if (
            x < -50 ||
            x > WIDTH + 50
        ) {
            continue;
        }

        /*
           Body
        */

        ctx.fillStyle = "#8b4513";

        ctx.beginPath();

        ctx.roundRect(
            x,
            e.y + 8,
            e.width,
            e.height - 8,
            8
        );

        ctx.fill();

        /*
           Eyes
        */

        ctx.fillStyle = "white";

        ctx.fillRect(
            x + 8,
            e.y + 12,
            7,
            8
        );

        ctx.fillRect(
            x + 24,
            e.y + 12,
            7,
            8
        );

        ctx.fillStyle = "black";

        ctx.fillRect(
            x + 10,
            e.y + 14,
            3,
            5
        );

        ctx.fillRect(
            x + 26,
            e.y + 14,
            3,
            5
        );

        /*
           Feet
        */

        ctx.fillStyle = "#542b15";

        ctx.fillRect(
            x + 3,
            e.y + e.height - 4,
            13,
            6
        );

        ctx.fillRect(
            x + 22,
            e.y + e.height - 4,
            13,
            6
        );
    }
}


/* =========================================================
   DRAW POWER UPS
========================================================= */

function drawPowerUps() {

    for (const p of powerUps) {

        if (p.collected) {
            continue;
        }

        const x = p.x - cameraX;

        ctx.save();

        ctx.translate(
            x + p.w / 2,
            p.y + p.h / 2
        );

        ctx.rotate(Date.now() / 700);

        ctx.fillStyle = "#fff200";

        ctx.beginPath();

        for (let i = 0; i < 10; i++) {

            const radius =
                i % 2 === 0 ? 15 : 7;

            const angle =
                -Math.PI / 2 +
                i * Math.PI / 5;

            const px =
                Math.cos(angle) * radius;

            const py =
                Math.sin(angle) * radius;

            if (i === 0) {
                ctx.moveTo(px, py);
            }
            else {
                ctx.lineTo(px, py);
            }
        }

        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW FLAG
========================================================= */

function drawFlag() {

    if (!flag) {
        return;
    }

    const x = flag.x - cameraX;

    /*
       Pole
    */

    ctx.fillStyle = "#eeeeee";

    ctx.fillRect(
        x,
        flag.y,
        flag.w,
        flag.h
    );

    /*
       Top
    */

    ctx.fillStyle = "#eeeeee";

    ctx.beginPath();

    ctx.arc(
        x + flag.w / 2,
        flag.y,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
       Flag
    */

    ctx.fillStyle = "#e52521";

    ctx.beginPath();

    ctx.moveTo(
        x + flag.w,
        flag.y + 15
    );

    ctx.lineTo(
        x + flag.w + 70,
        flag.y + 35
    );

    ctx.lineTo(
        x + flag.w,
        flag.y + 60
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    if (
        player.invincible > 0 &&
        Math.floor(player.invincible / 6) % 2 === 0
    ) {
        return;
    }

    const x = player.x - cameraX;
    const y = player.y;

    /*
       Legs
    */

    ctx.fillStyle = "#2446a8";

    ctx.fillRect(
        x + 5,
        y + 30,
        10,
        18
    );

    ctx.fillRect(
        x + 20,
        y + 30,
        10,
        18
    );

    /*
       Shoes
    */

    ctx.fillStyle = "#5b2c16";

    ctx.fillRect(
        x + 2,
        y + 44,
        15,
        7
    );

    ctx.fillRect(
        x + 18,
        y + 44,
        15,
        7
    );

    /*
       Body
    */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(
        x + 5,
        y + 17,
        25,
        20
    );

    /*
       Shirt
    */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(
        x,
        y + 20,
        8,
        15
    );

    ctx.fillRect(
        x + 26,
        y + 20,
        8,
        15
    );

    /*
       Overalls
    */

    ctx.fillStyle = "#2452bd";

    ctx.fillRect(
        x + 8,
        y + 23,
        18,
        14
    );

    /*
       Head
    */

    ctx.fillStyle = "#f2b27b";

    ctx.fillRect(
        x + 8,
        y + 5,
        19,
        19
    );

    /*
       Ear
    */

    ctx.fillRect(
        x + 26,
        y + 11,
        6,
        9
    );

    /*
       Hair
    */

    ctx.fillStyle = "#542b15";

    ctx.fillRect(
        x + 8,
        y + 4,
        20,
        6
    );

    ctx.fillRect(
        x + 5,
        y + 7,
        7,
        8
    );

    /*
       Hat
    */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(
        x + 5,
        y,
        24,
        7
    );

    ctx.fillRect(
        x,
        y + 5,
        28,
        6
    );

    /*
       Eye
    */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        x + 22,
        y + 11,
        3,
        4
    );

    /*
       Nose
    */

    ctx.fillStyle = "#d98d5c";

    ctx.fillRect(
        x + 25,
        y + 15,
        6,
        5
    );
}


/* =========================================================
   GAME DRAW
========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawBackground();

    drawPlatforms();
    drawCoins();
    drawPowerUps();
    drawEnemies();
    drawFlag();
    drawPlayer();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (gameRunning) {

        updatePlayer();
        updateEnemies();
        updateCoins();
        updatePowerUps();

        checkFlag();
        updateCamera();

        updateHUD();
    }

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown", e => {

    if (
        e.code === "ArrowLeft" ||
        e.code === "KeyA"
    ) {

        keys.left = true;
        e.preventDefault();
    }

    if (
        e.code === "ArrowRight" ||
        e.code === "KeyD"
    ) {

        keys.right = true;
        e.preventDefault();
    }

    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ) {

        keys.jump = true;
        e.preventDefault();
    }
});


window.addEventListener("keyup", e => {

    if (
        e.code === "ArrowLeft" ||
        e.code === "KeyA"
    ) {
        keys.left = false;
    }

    if (
        e.code === "ArrowRight" ||
        e.code === "KeyD"
    ) {
        keys.right = false;
    }

    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ) {
        keys.jump = false;
    }
});


/* =========================================================
   MOBILE CONTROLS
========================================================= */

function setupMobileButton(id, key) {

    const button =
        document.getElementById(id);

    const start = e => {

        e.preventDefault();

        keys[key] = true;
    };

    const end = e => {

        e.preventDefault();

        keys[key] = false;
    };

    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        end
    );

    button.addEventListener(
        "pointercancel",
        end
    );

    button.addEventListener(
        "pointerleave",
        end
    );
}

setupMobileButton("leftBtn", "left");
setupMobileButton("rightBtn", "right");
setupMobileButton("jumpBtn", "jump");


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("startButton")
    .addEventListener("click", () => {

        document
            .getElementById("startScreen")
            .classList.add("hidden");

        startLevel();
    });


document
    .getElementById("nextLevelButton")
    .addEventListener("click", () => {

        nextLevel();
    });


document
    .getElementById("restartButton")
    .addEventListener("click", () => {

        document
            .getElementById("gameOverScreen")
            .classList.add("hidden");

        resetGame();
    });


document
    .getElementById("winRestartButton")
    .addEventListener("click", () => {

        document
            .getElementById("winScreen")
            .classList.add("hidden");

        resetGame();
    });


/* =========================================================
   INITIALIZATION
========================================================= */

createLevel(1);
updateHUD();
draw();
gameLoop();

</script>
